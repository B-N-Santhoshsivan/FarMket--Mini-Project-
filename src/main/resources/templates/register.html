
<!DOCTYPE html>
<html>
<head>
    <title>Register - FarMket</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #edf4e9;
            margin: 0;
            padding: 40px 15px;
            color: #193f2e;
        }

        .container {
            background-color: white;
            width: 90%;
            max-width: 435px;
            margin: auto;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 15px;
        }

        .subtitle {
            text-align: center;
            color: #718074;
            margin-bottom: 35px;
            font-size: 18px;
        }

        /* Farmer and Buyer options */
        .role {
            margin-bottom: 25px;
        }

        .role input[type="radio"] {
            width: auto;
            display: inline;
            margin: 0 5px 0 0;
        }

        .role label {
            display: inline;
            margin-right: 20px;
            font-weight: normal;
            cursor: pointer;
        }

        /* Form labels */
        .field-label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* Text boxes */
        .text-input {
            width: 100%;
            padding: 14px;
            margin-bottom: 25px;
            border: 1px solid #d4e0d2;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .text-input:focus {
            outline: 2px solid #8bb99a;
        }

        /* Register button */
        button {
            width: 100%;
            padding: 15px;
            background-color: #17683e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #105531;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #17683e;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }

        .home-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Create Account</h1>

        <p class="subtitle">
            From Farm to Market, FarMket.
        </p>
        <p th:if="${error}"
   th:text="${error}"
   style="color: red;">
</p>

<p th:if="${success}"
   th:text="${success}"
   style="color: green;">
</p>

        <form action="/register" method="post">

            <div class="role">
                Choose your role :
                <input type="radio"
                       id="farmer"
                       name="role"
                       value="FARMER"
                       required>
                Farmer

                <input type="radio"
                       id="buyer"
                       name="role"
                       value="BUYER">
                Buyer
            </div>

            <label class="field-label" >
                Full name
            </label>
            <input class="text-input"
                   type="text"
                   id="fullname"
                   name="fullname"
                   placeholder="Your full name"
                   required>

            <label class="field-label" >
                Email
            </label>
            <input class="text-input"
                   type="email"
                   id="email"
                   name="email"
                   placeholder="you@example.com"
                   required>

            <label class="field-label" >
                Password
            </label>
            <input class="text-input"
                   type="password"
                   id="password"
                   name="password"
                   placeholder="Create a password"
                   required
                   minlength="8">

            <label class="field-label">
                District
            </label>
            <input class="text-input"
                   type="text"
                   id="district"
                   name="district"
                   placeholder="Enter your district"
                   required>

            <button type="submit">Register</button>

        </form>

        <a class="home-link" href="/">
          <-Back to Home
        </a>

    </div>

</body>
</html>
